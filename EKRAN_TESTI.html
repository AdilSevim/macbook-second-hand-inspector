<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MacBook Ekran Testi</title><style>body{margin:0;font-family:system-ui;background:#111;color:white}#screen{position:fixed;inset:0;background:white;display:none;z-index:1}#panel{max-width:720px;margin:10vh auto;padding:25px}button{padding:14px;margin:7px;cursor:pointer}#bar{position:fixed;bottom:15px;left:15px;z-index:2;background:#222;color:white;padding:12px;border-radius:10px;display:none}</style><div id="panel"><h1>MacBook ekran / ölü piksel testi</h1><p>Renkleri tek tek inceleyin. Nokta, çizgi, parlaklık farkı veya renk bozulması arayın. Bu test otomatik piksel tespiti yapmaz.</p><button onclick="start()">Testi başlat</button><p>Sağ / sol ok: renk değiştir · Esc: çıkış · F: tam ekran</p></div><div id="screen"></div><div id="bar"><span id="name"></span> <button onclick="move(-1)">◀</button><button onclick="move(1)">▶</button><button onclick="stop()">Çıkış</button></div><script>const colors=[["Beyaz","#fff"],["Siyah","#000"],["Kırmızı","#f00"],["Yeşil","#0f0"],["Mavi","#00f"],["Gri","#888"],["Koyu gri","#333"]];let i=0;const screen=document.getElementById("screen"),bar=document.getElementById("bar");function paint(){screen.style.background=colors[i][1];document.getElementById("name").textContent=colors[i][0]}function start(){screen.style.display="block";bar.style.display="block";i=0;paint();document.documentElement.requestFullscreen?.().catch(()=>{})}function move(n){i=(i+n+colors.length)%colors.length;paint()}function stop(){screen.style.display="none";bar.style.display="none";if(document.fullscreenElement)document.exitFullscreen()}document.addEventListener("keydown",e=>{if(e.key==="Escape")stop();else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);else if(e.key.toLowerCase()==="f"&&screen.style.display==="block")document.documentElement.requestFullscreen?.().catch(()=>{})})</script></html>
