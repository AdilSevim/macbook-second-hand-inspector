<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MacBook Klavye Testi</title><style>body{background:#10141b;color:#eee;font-family:system-ui;margin:30px auto;max-width:1000px}#keys{display:grid;grid-template-columns:repeat(12,minmax(35px,1fr));gap:8px;margin-top:25px}.key{padding:12px 2px;text-align:center;border:1px solid #777;border-radius:8px;background:#27313d}.seen{background:#18794e;color:white}button{padding:12px;margin:10px 10px 0 0}</style><h1>MacBook klavye testi</h1><p>Her tuşa basın. Algılanan tuşlar yeşile döner. Tarayıcı bazı sistem tuşlarını yakalayamaz; Touch ID, Fn, parlaklık ve ses tuşlarını ayrıca deneyin.</p><p id="count"></p><div id="keys"></div><p id="last"></p><button onclick="download()">TXT raporu indir</button><button onclick="reset()">Sıfırla</button><script>const codes="Backquote Digit1 Digit2 Digit3 Digit4 Digit5 Digit6 Digit7 Digit8 Digit9 Digit0 Minus Equal Backspace Tab KeyQ KeyW KeyE KeyR KeyT KeyY KeyU KeyI KeyO KeyP BracketLeft BracketRight Backslash CapsLock KeyA KeyS KeyD KeyF KeyG KeyH KeyJ KeyK KeyL Semicolon Quote Enter ShiftLeft KeyZ KeyX KeyC KeyV KeyB KeyN KeyM Comma Period Slash ShiftRight ControlLeft AltLeft MetaLeft Space MetaRight AltRight ArrowLeft ArrowDown ArrowUp ArrowRight".split(" ");const seen=new Set();const box=document.getElementById("keys");codes.forEach(c=>{const b=document.createElement("div");b.className="key";b.id="k"+c;b.textContent=c.replace(/^(Key|Digit)/,"");box.appendChild(b)});function render(){document.getElementById("count").textContent=seen.size+" / "+codes.length+" tuş algılandı";codes.forEach(c=>document.getElementById("k"+c).classList.toggle("seen",seen.has(c)))}document.addEventListener("keydown",e=>{e.preventDefault();if(codes.includes(e.code))seen.add(e.code);document.getElementById("last").textContent="Son tuş: "+e.code;render()});function reset(){seen.clear();render()}function download(){const content="MACBOOK KEYBOARD TEST\nDate: "+new Date().toISOString()+"\nDetected: "+[...seen].join(", ")+"\nNot detected: "+codes.filter(c=>!seen.has(c)).join(", ")+"\nNot detected does not prove failure; test each key manually.\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:"text/plain"}));a.download="MacBook_Klavye_Test.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render()</script></html>
